services:
  nps-analyzer:
    build: .
    image: nps-analyzer:latest
    container_name: nps-analyzer
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - HF_ENDPOINT=https://hf-mirror.com
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    restart: "no"
